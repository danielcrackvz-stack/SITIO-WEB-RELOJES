<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Reloj - Cronos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body class="light-theme">

  <header class="main-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="img/logo-cronos.png" alt="Cronos Logo" class="nav-logo" onerror="this.style.display='none'">
        <span>CRONOS</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Colección</a>
        <a href="agente-ia.html">Asesor Virtual</a>
      </nav>
    </div>
  </header>

  <main class="product-page-main">
    <div class="product-detail-layout">
      
      <!-- Columna Izquierda: Visor 3D directo -->
      <section class="viewer-column">
        <div class="product-viewer-container">
          <model-viewer
            id="reloj-viewer"
            src=""
            poster=""
            loading="eager"
            camera-controls
            auto-rotate
            rotation-per-second="30deg"
            touch-action="pan-y"
            shadow-intensity="1.2"
            shadow-softness="0.8"
            environment-image="neutral"
            exposure="1.0"
            camera-orbit="0deg 75deg 105%"
            min-camera-orbit="auto auto 65%"
            max-camera-orbit="auto auto 220%"
            alt="Visualización 3D Reloj">

            <!-- Barra de progreso discreta durante la descarga inicial -->
            <div slot="progress-bar" class="custom-progress-bar hide" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
              <span class="progress-text" id="progress-text">Cargando 3D...</span>
            </div>

            <!-- Controles flotantes de cámara -->
            <div class="viewer-floating-controls" id="viewer-controls">
              <button type="button" id="btn-rotate-toggle" title="Girar reloj" class="active">🔄 Giro</button>
              <button type="button" id="btn-front-cam" title="Vista Frontal">🎯 Frontal</button>
              <button type="button" id="btn-side-cam" title="Vista Lateral">📐 Perfil</button>
            </div>
          </model-viewer>
        </div>
      </section>

      <!-- Columna Derecha: Información del Producto -->
      <section class="info-column">
        <div class="product-info-card">
          <span class="badge-edition" id="producto-categoria">COLECCIÓN EXCLUSIVA</span>
          <h1 id="producto-nombre" class="product-title">Cargando pieza...</h1>
          
          <div class="price-container">
            <span class="currency">Bs</span>
            <span id="producto-precio" class="price-val">0.00</span>
          </div>

          <p id="producto-descripcion" class="product-description">
            Cargando detalles de la pieza seleccionada...
          </p>

          <div class="specs-grid">
            <div class="spec-item">
              <span class="spec-label">Material</span>
              <span class="spec-value" id="producto-material">Acero Inoxidable</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Movimiento</span>
              <span class="spec-value" id="producto-movimiento">Automático</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Resistencia</span>
              <span class="spec-value" id="producto-resistencia">100m (10 ATM)</span>
            </div>
          </div>

          <div class="actions-group">
            <a href="#" id="btn-whatsapp-comprar" class="btn-primary-action" target="_blank" rel="noopener noreferrer">
              Solicitar por WhatsApp
            </a>
            <a href="catalogo.html" class="btn-secondary-action">
              Volver al Catálogo
            </a>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="js/supabase-config.js"></script>
  <script src="js/whatsapp-config.js"></script>
  <script src="js/detalle-producto.js?v=2"></script>
</body>
</html>
